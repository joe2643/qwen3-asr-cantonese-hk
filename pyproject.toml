[project]
name = "qwen3-asr-cantonese-hk"
version = "2.0.0"
description = "Usage and evaluation scripts for the Hong Kong Cantonese fine-tune of Qwen3-ASR-1.7B"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
eval = ["opencc-python-reimplemented"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
